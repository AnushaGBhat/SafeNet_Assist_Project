version: "3.1"

intents:
  - greet
  - goodbye
  - ask_help
  - ask_procedure
  - report_fraud
  - phishing_help
  - upload_info
  - general_query
  - forgot_password
  - suspicious_link
  - scam_call
  - financial_fraud
  - social_media_hack
  - harassment
  - need_counselling
  - cyber_bullying
  - otp_fraud
  - explain_terms
  - ask_complaint_status
  - say_thanks
  - deny
  - fake_police_call
  - ask_why_called
