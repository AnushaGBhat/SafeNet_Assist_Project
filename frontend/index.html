<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeNet Assist Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">
  <div class="container">
    <aside class="sidebar">
      <div class="brand">🛡️ SafeNet Assist</div>
      <button id="new-chat">+ New Chat</button>
      <div id="chat-history" class="chat-history"></div>
    </aside>
    <main class="chat-area">
      <div id="chat-box" class="chat-box"></div>
      <form id="chat-form" class="chat-form">
        <label for="file-upload" class="file-upload-label">📎</label>
        <input type="file" id="file-upload" hidden />
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" required/>
        <button type="button" id="mic-btn" class="mic-btn"><img src="https://img.icons8.com/ios-filled/24/ffffff/microphone.png"/></button>
        <button type="submit" id="send-btn">➤</button>
      </form>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
